name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Copy app to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          port: 22
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: ~/bar-menu

      - name: Build and run on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          port: 22
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/bar-menu
            docker build -t bar-menu:latest .
            docker stop bar-menu || true
            docker rm bar-menu || true
            docker image prune -f || true
            docker run -d \
              --name bar-menu \
              --restart unless-stopped \
              -p 5001:5001 \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              -e SECRET_KEY='${{ secrets.SECRET_KEY }}' \
              -e ADMIN_USERNAME='${{ secrets.ADMIN_USERNAME }}' \
              -e ADMIN_PASSWORD_HASH='${{ secrets.ADMIN_PASSWORD_HASH }}' \
              -e APP_ENV=production \
              bar-menu:latest