<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Wines</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cocktails.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/wines.css') }}">
  <script defer src="{{ url_for('static', filename='js/wine_modal.js') }}"></script>
</head>
<body>
  <header class="header">
    <h1 class="title">All Wines</h1>
    <a class="home-btn" href="{{ url_for('get_home_page') }}">Home</a>
  </header>
  <main class="container">
    {% for section in section_order %}
      {% if section in grouped %}
        {% set sizes = section_sizes[section] %}
        <div class="wine-cols-{{ sizes|length }}">
          <h2>{{ section|capitalize }}</h2>
          <div class="wine-price-header">
            <span></span>
            {% for size in sizes %}
              <span class="wine-price-cell">{{ size }}ml</span>
            {% endfor %}
          </div>
          <ul class="product-list">
            {% for wine in grouped[section] %}
              <li class="product-item">
              <button class="more-button-wines" type="button" data-more-id="{{ wine.id }}">
                  <div class="wine-price-row">
                    <span class="product-name">{{ wine.name|e }}</span>
                    {% for size in sizes %}
                      <span class="wine-price-cell">
                        {% if size in wine.price_by_ml %}
                          £{{ "%.2f"|format(wine.price_by_ml[size]) }}
                        {% else %}
                          &mdash;
                        {% endif %}
                      </span>
                    {% endfor %}
                  </div>
                </button>
              </li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}
    {% endfor %}
  </main>

  <div class="overlay" id="overlay" hidden aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" id="closeModal" type="button" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
</body>
</html>
