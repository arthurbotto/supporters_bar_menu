<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Wines</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/wines.css') }}">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="{{ url_for('static', filename='js/wine_modal.js') }}"></script>
</head>
<body>
  <header class="header">
    <h1 class="title">All Wines</h1>
    <a class="home-btn" href="{{ url_for('get_home_page') }}">Home</a>
  </header>
  <div class="search">
    <input
      type="text"
      name="q"
      placeholder="Search wines..."
      hx-get="/search_wines"
      hx-trigger="load, keyup changed delay:300ms"
      hx-target="#wineResults"
      hx-swap="innerHTML"
      autocomplete="off"
    >
  </div>
  <main class="container" id="wineResults">
    {% include "wines_list.html" %}
  </main>

  <div class="overlay" id="overlay" hidden aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" id="closeModal" type="button" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
</body>
</html>
