<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Wines</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/wines.css') }}">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="{{ url_for('static', filename='js/wine_modal.js') }}"></script>
</head>
<body>
  <header class="header">
    <h1 class="title">All Wines</h1>
    <a class="home-btn" href="{{ url_for('get_home_page') }}">Home</a>
  </header>
  <div id="wine-filters" class="wine-filters">

    <div class="filter-search">
      <input
        type="text" name="q" placeholder="Search by name..."
        hx-get="/search_wines"
        hx-trigger="load, keyup changed delay:300ms"
        hx-target="#wineResults"
        hx-swap="innerHTML"
        hx-include="#wine-filters"
        autocomplete="off"
      >
    </div>

    <div class="filter-controls">
      <select name="country" class="filter-select">
        <option value="">Country</option>
        {% for country in countries %}
         <option value="{{ country }}">{{ country }}</option>
        {% endfor %}
      </select>

      <select name="subcategory" class="filter-select">
        <option value="">Type</option>
        {% for value, label in subcategory_labels.items() %}
          <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>

      <select name="producer" class="filter-select">
        <option value="">Producer</option>
        {% for producer in producers %}
          <option value="{{ producer }}">{{ producer }}</option>
        {% endfor %}
      </select>

      <select name="sweetness" class="filter-select">
        <option value="">Sweetness</option>
        {% for s_level in sweet_levels %}
          <option value="{{ s_level }}">{{ s_level }}</option>
        {% endfor %}
      </select>

      <select name="body" class="filter-select">
        <option value="">Body</option>
        {% for body in bodies %}
          <option value="{{ body }}">{{ body }}</option>
        {% endfor %}
      </select>

      <select name="acidity" class="filter-select">
        <option value="">Acidity</option>
        {% for a_level in acid_levels %}
          <option value="{{ a_level }}">{{ a_level }}</option>
        {% endfor %}
      </select>

      <label class="filter-checkbox-label">
        <input type="checkbox" name="organic" value="true">
        Organic 
      </label>

      <label class="filter-checkbox-label">
        <input type="checkbox" name="vegan" value="true">
        Vegan
      </label>

      <button type="button" class="filter-apply-btn"
        hx-get="/search_wines"
        hx-trigger="click"
        hx-include="#wine-filters"
        hx-target="#wineResults"
        hx-swap="innerHTML"
        >Apply Filters
      </button>
      <a href="/wines" class="filter-clear-btn">Clear</a> 
    </div>

  </div>

  <main class="container" id="wineResults">
    {% include "wines_list.html" %}
  </main>

  <div class="overlay" id="overlay" hidden aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" id="closeModal" type="button" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
</body>
</html>
