{% extends "base.html" %}
{% block title %}Cocktail Menu{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cocktails.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
{% endblock %}

{% block extra_scripts %}
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="{{ url_for('static', filename='js/menu.js') }}"></script>
{% endblock %}

{% block content %}
  <header class="header">
    <h1 class="title">Cocktails</h1>
    <p class="subtitle">Click a cocktail to see ingredients.</p>
    <a class="home-btn" href="{{ url_for('get_home_page') }}">Home</a>
  </header>
  <div class="search">
    <input
      type="text"
      name="q"
      placeholder="Search by name or ingredient..."
      hx-get="/search_cocktails"
      hx-trigger="load, keyup changed delay:300ms"
      hx-target="#cocktailResults"
      hx-swap="innerHTML"
      autocomplete="off"
    >
  </div>

  <main class="container">
    <ul class="product-list" id="cocktailResults">
      {% include "cocktail_list.html" %}
    </ul>
  </main>

  <div class="overlay" id="overlay" hidden aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" id="closeModal" type="button" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
{% endblock %}
