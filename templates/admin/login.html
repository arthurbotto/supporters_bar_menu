<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <h1>Supporters Admin</h1>

      {% if error %}
        <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('admin_login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem">Log in</button>
      </form>
      <a href="{{ url_for('get_home_page') }}" class="btn btn-secondary" style="display:block; text-align:center; margin-top:0.75rem">Back to menu</a>
    </div>
  </div>
</body>
</html>
