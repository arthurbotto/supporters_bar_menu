{% extends "admin/base.html" %}
{% block title %}Products{% endblock %}

{% block extra_scripts %}
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
{% endblock %}
{% block content %}
<div class="admin-toolbar">
  <h1 class="admin-page-title" style="margin:0">Products</h1>
  <a href="{{ url_for('admin_product_new') }}" class="btn btn-primary">+ New product</a>
</div>

<div class="admin-search">
  <input
    type="text"
    name="q"
    placeholder="Search product"
    hx-get="/admin/search_products"
    hx-trigger="load, keyup changed delay:300ms"
    hx-target="#productResults"
    hx-swap="innerHTML"
    autocomplete="off"
  >
</div>

<table class="admin-table" id="productResults">
  {% include "admin/products_list.html" %}
</table>
{% endblock %}
