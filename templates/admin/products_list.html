<thead>
    <tr>
      <th>Name</th>
      <th>Category</th>
      <th>Subcategory</th>
      <th>Code</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for p in products %}
    <tr>
      <td>{{ p.name }}</td>
      <td>{{ p.category }}</td>
      <td>{{ p.subcategory or '—' }}</td>
      <td class="code-cell">{{ p.code }}</td>
      <td>
        {% if p.is_active %}
          <span class="badge badge-active">Active</span>
        {% else %}
          <span class="badge badge-inactive">Inactive</span>
        {% endif %}
      </td>
      <td class="actions">
        <a href="{{ url_for('admin_product_edit', product_id=p.id) }}" class="btn btn-secondary btn-sm">Edit</a>
        <a href="{{ url_for('admin_product_variants', product_id=p.id) }}" class="btn btn-secondary btn-sm">Variants</a>
        <form method="post" action="{{ url_for('admin_toggle_active', product_id=p.id) }}" style="display:inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="btn btn-secondary btn-sm">
            {{ 'Deactivate' if p.is_active else 'Activate' }}
          </button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="6" style="text-align:center; color:#888; padding:2rem">No products yet.</td>
    </tr>
    {% endfor %}
  </tbody>
